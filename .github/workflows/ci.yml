name: Windows client CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest --basetemp=.pytest-tmp

      - name: Compile
        run: python -m compileall -q src

  package-smoke:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and smoke-test frozen application
        shell: pwsh
        run: ./packaging/build.ps1 -Python python

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: StudentScheduleWorker-${{ github.ref_name }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem "dist\installer\*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)."
          }
          gh release create $env:GITHUB_REF_NAME $installers[0].FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title "Student Schedule Worker $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
